name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore, Build & Test Desktop App
        run: |
          dotnet restore SyncSound.sln
          dotnet build SyncSound.sln -c Release --no-restore
          dotnet test SyncSound.sln -c Release --no-build --verbosity normal

      - name: Publish Self-Contained App
        run: |
          dotnet publish src/SyncSound.App/SyncSound.App.csproj -c Release --no-restore -o publish/app

      - name: Upload App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SYNC-SOUND-x64
          path: publish/app/SyncSound.App.exe

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Landing Page
        working-directory: website
        run: |
          npm ci
          npm run build
